<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delivery Playbook — 交互式流程图</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f1a;
    --surface: #1a1a2e;
    --surface2: #16213e;
    --border: rgba(255,255,255,0.08);
    --text: #e2e8f0;
    --text-muted: #94a3b8;
    --accent: #6366f1;
    --accent-glow: rgba(99,102,241,0.3);
    --p1: #4f46e5;
    --p2: #0891b2;
    --p3: #059669;
    --p4: #d97706;
    --p5: #dc2626;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  
  /* ---- Header ---- */
  .header {
    background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
    border-bottom: 1px solid var(--border);
    padding: 20px 32px;
    display: flex;
    align-items: center;
    gap: 20px;
    position: sticky; top: 0; z-index: 100;
    backdrop-filter: blur(20px);
  }
  .header-title { font-size: 20px; font-weight: 700; }
  .header-title span { color: #818cf8; }
  .header-stats {
    margin-left: auto;
    display: flex; gap: 16px; align-items: center;
  }
  .stat-badge {
    background: rgba(99,102,241,0.15);
    border: 1px solid rgba(99,102,241,0.3);
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 12px;
    color: #a5b4fc;
  }

  /* ---- Layout ---- */
  .app-layout {
    display: flex;
    height: calc(100vh - 65px);
  }
  
  /* ---- Sidebar ---- */
  .sidebar {
    width: 280px;
    min-width: 280px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .sidebar-section {
    padding: 16px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-label {
    font-size: 10px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--text-muted); margin-bottom: 10px;
  }
  
  /* View Toggle */
  .view-toggle {
    display: flex; gap: 4px;
    background: rgba(0,0,0,0.3);
    padding: 4px; border-radius: 10px;
  }
  .view-btn {
    flex: 1; padding: 8px 4px;
    background: transparent; border: none;
    color: var(--text-muted); cursor: pointer;
    border-radius: 7px; font-size: 12px; font-weight: 500;
    transition: all 0.2s;
  }
  .view-btn.active {
    background: var(--accent);
    color: white;
    box-shadow: 0 2px 8px rgba(99,102,241,0.4);
  }
  
  /* Phase selector */
  .phase-list { display: flex; flex-direction: column; gap: 4px; }
  .phase-btn {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; border-radius: 8px;
    background: transparent; border: 1px solid transparent;
    color: var(--text-muted); cursor: pointer;
    font-size: 13px; font-weight: 500;
    transition: all 0.2s; text-align: left;
  }
  .phase-btn:hover { background: rgba(255,255,255,0.05); color: var(--text); }
  .phase-btn.active {
    border-color: rgba(255,255,255,0.15);
    color: var(--text);
  }
  .phase-dot {
    width: 10px; height: 10px; border-radius: 50%;
    flex-shrink: 0;
  }
  .phase-count {
    margin-left: auto;
    font-size: 11px; color: var(--text-muted);
    background: rgba(255,255,255,0.07);
    padding: 2px 7px; border-radius: 10px;
  }
  
  /* Role selector */
  .role-search {
    width: 100%; background: rgba(0,0,0,0.3);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 12px; color: var(--text);
    font-size: 12px; margin-bottom: 10px;
    outline: none;
  }
  .role-search:focus { border-color: var(--accent); }
  .role-list {
    display: flex; flex-direction: column; gap: 2px;
    max-height: 300px; overflow-y: auto;
  }
  .role-list::-webkit-scrollbar { width: 4px; }
  .role-list::-webkit-scrollbar-track { background: transparent; }
  .role-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }
  .role-item {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; border-radius: 7px;
    background: transparent; border: none;
    color: var(--text-muted); cursor: pointer;
    font-size: 12px; text-align: left;
    transition: all 0.2s;
  }
  .role-item:hover { background: rgba(255,255,255,0.05); color: var(--text); }
  .role-item.active {
    background: rgba(99,102,241,0.15);
    border: 1px solid rgba(99,102,241,0.3);
    color: #a5b4fc;
  }
  .role-icon { font-size: 14px; }
  
  /* ---- Main Content ---- */
  .main {
    flex: 1; overflow: auto;
    padding: 24px;
  }
  .main::-webkit-scrollbar { width: 6px; }
  .main::-webkit-scrollbar-track { background: transparent; }
  .main::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
  
  /* ---- Phase Flow View ---- */
  .phase-header {
    display: flex; align-items: center; gap: 16px;
    margin-bottom: 24px;
  }
  .phase-title {
    font-size: 22px; font-weight: 700;
  }
  .phase-subtitle { color: var(--text-muted); font-size: 13px; margin-top: 4px; }
  
  /* Pipeline overview */
  .pipeline {
    display: flex; align-items: center; gap: 0;
    margin-bottom: 28px; overflow-x: auto; padding-bottom: 8px;
  }
  .pipeline-phase {
    display: flex; align-items: center; gap: 0;
    flex-shrink: 0;
  }
  .pipeline-node {
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 12px; font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    border: 2px solid transparent;
    white-space: nowrap;
  }
  .pipeline-node:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.3); }
  .pipeline-node.active { border-color: white !important; }
  .pipeline-arrow {
    color: var(--text-muted); font-size: 16px;
    padding: 0 6px;
  }
  
  /* Wave blocks */
  .wave-section {
    margin-bottom: 16px;
  }
  .wave-header {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 10px; padding: 10px 14px;
    background: rgba(255,255,255,0.03);
    border-radius: 8px; border-left: 3px solid;
    cursor: pointer;
    transition: all 0.2s;
  }
  .wave-header:hover { background: rgba(255,255,255,0.06); }
  .wave-label {
    font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--text-muted);
  }
  .wave-roles { display: flex; gap: 6px; flex-wrap: wrap; }
  .wave-role-chip {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 20px;
    padding: 3px 10px; font-size: 11px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .wave-role-chip:hover {
    background: rgba(99,102,241,0.2);
    border-color: rgba(99,102,241,0.4);
    color: #a5b4fc;
  }
  .wave-role-chip.highlighted {
    background: rgba(99,102,241,0.25);
    border-color: rgba(99,102,241,0.5);
    color: #a5b4fc;
  }
  .wave-parallel {
    font-size: 10px; color: var(--text-muted);
    margin-left: auto;
  }
  .wave-expand-icon {
    margin-left: 8px; color: var(--text-muted);
    font-size: 12px; transition: transform 0.2s;
  }
  
  /* Task cards grid */
  .task-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 10px;
    margin-left: 16px;
    margin-bottom: 8px;
  }
  .task-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .task-card::before {
    content: '';
    position: absolute; top: 0; left: 0;
    width: 3px; height: 100%;
  }
  .task-card:hover {
    border-color: rgba(99,102,241,0.4);
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(0,0,0,0.3);
  }
  .task-card.highlighted {
    border-color: rgba(99,102,241,0.5);
    background: rgba(99,102,241,0.08);
  }
  .task-role-badge {
    font-size: 10px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--text-muted); margin-bottom: 6px;
    display: flex; align-items: center; gap: 5px;
  }
  .task-name {
    font-size: 13px; font-weight: 600; color: var(--text);
    margin-bottom: 6px; line-height: 1.4;
  }
  .task-id {
    font-size: 10px; color: var(--text-muted);
    font-family: monospace;
  }
  .task-desc-preview {
    font-size: 11px; color: var(--text-muted);
    margin-top: 8px; line-height: 1.5;
    display: -webkit-box; -webkit-line-clamp: 2;
    -webkit-box-orient: vertical; overflow: hidden;
  }
  .task-next-count {
    display: inline-flex; align-items: center; gap: 4px;
    margin-top: 8px;
    font-size: 10px; color: var(--text-muted);
    background: rgba(255,255,255,0.05);
    padding: 3px 8px; border-radius: 10px;
  }

  /* ---- Role View ---- */
  .role-view-header {
    display: flex; align-items: center; gap: 16px;
    margin-bottom: 24px;
  }
  .role-icon-large {
    font-size: 36px;
    width: 64px; height: 64px;
    background: rgba(99,102,241,0.15);
    border: 1px solid rgba(99,102,241,0.3);
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
  }
  .role-name-large {
    font-size: 24px; font-weight: 700;
  }
  .role-task-count {
    color: var(--text-muted); font-size: 13px; margin-top: 4px;
  }
  
  /* Role phases timeline */
  .role-timeline {
    display: flex; flex-direction: column; gap: 24px;
  }
  .role-phase-block {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .role-phase-header {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
  }
  .role-phase-label {
    font-size: 13px; font-weight: 600;
    color: var(--text);
  }
  .role-phase-wave {
    font-size: 11px; color: var(--text-muted);
    margin-left: auto;
    background: rgba(255,255,255,0.06);
    padding: 3px 10px; border-radius: 10px;
  }
  .role-tasks-list { padding: 14px 18px; display: flex; flex-direction: column; gap: 10px; }
  .role-task-item {
    display: flex; gap: 12px;
    padding: 12px 14px;
    background: var(--surface2);
    border-radius: 9px;
    border: 1px solid var(--border);
    cursor: pointer; transition: all 0.2s;
  }
  .role-task-item:hover {
    border-color: rgba(99,102,241,0.3);
    background: rgba(99,102,241,0.06);
  }
  .role-task-step {
    font-size: 18px; font-weight: 800;
    color: rgba(255,255,255,0.15);
    min-width: 24px;
  }
  .role-task-info { flex: 1; }
  .role-task-name { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  .role-task-desc { font-size: 11px; color: var(--text-muted); line-height: 1.5; }
  .role-task-id { font-size: 10px; color: var(--text-muted); font-family: monospace; margin-top: 4px; }
  
  /* ---- Detail Modal ---- */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(8px);
    z-index: 200;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s;
  }
  .modal-overlay.show {
    opacity: 1; pointer-events: all;
  }
  .modal {
    background: var(--surface);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 16px;
    width: 100%; max-width: 600px;
    max-height: 80vh; overflow-y: auto;
    box-shadow: 0 24px 64px rgba(0,0,0,0.6);
    transform: translateY(20px);
    transition: transform 0.2s;
  }
  .modal-overlay.show .modal { transform: translateY(0); }
  .modal-header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: flex-start; gap: 12px;
  }
  .modal-phase-badge {
    font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.08em; padding: 3px 10px;
    border-radius: 20px; white-space: nowrap; margin-top: 2px;
  }
  .modal-close {
    margin-left: auto; background: none; border: none;
    color: var(--text-muted); cursor: pointer; font-size: 20px;
    padding: 4px; border-radius: 6px;
    transition: all 0.2s;
  }
  .modal-close:hover { background: rgba(255,255,255,0.1); color: var(--text); }
  .modal-task-name {
    font-size: 17px; font-weight: 700; margin-top: 4px;
    line-height: 1.3;
  }
  .modal-body { padding: 20px 24px; }
  .modal-section { margin-bottom: 18px; }
  .modal-section-label {
    font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--text-muted); margin-bottom: 8px;
  }
  .modal-section-content {
    font-size: 13px; color: var(--text); line-height: 1.6;
    background: rgba(0,0,0,0.2); padding: 12px 14px;
    border-radius: 8px; border: 1px solid var(--border);
  }
  .meta-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .meta-item {
    background: rgba(0,0,0,0.2); padding: 10px 14px;
    border-radius: 8px; border: 1px solid var(--border);
  }
  .meta-key { font-size: 10px; color: var(--text-muted); margin-bottom: 4px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
  .meta-val { font-size: 13px; font-weight: 600; }
  .next-task-list { display: flex; flex-direction: column; gap: 6px; }
  .next-task-chip {
    background: rgba(0,0,0,0.2); border: 1px solid var(--border);
    border-radius: 7px; padding: 8px 12px; font-size: 12px;
  }
  
  /* ---- Empty state ---- */
  .empty-state {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 64px 32px;
    color: var(--text-muted); text-align: center;
  }
  .empty-state-icon { font-size: 48px; margin-bottom: 16px; }
  .empty-state-title { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
  
  /* Search bar */
  .search-bar {
    display: flex; gap: 10px; margin-bottom: 20px;
  }
  .search-input {
    flex: 1; background: var(--surface);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 16px; color: var(--text);
    font-size: 13px; outline: none;
    transition: border-color 0.2s;
  }
  .search-input:focus { border-color: var(--accent); }
  .search-input::placeholder { color: var(--text-muted); }
  
  /* Tags */
  .tag { 
    display: inline-flex; align-items: center;
    background: rgba(99,102,241,0.12);
    border: 1px solid rgba(99,102,241,0.25);
    border-radius: 6px; padding: 2px 8px;
    font-size: 11px; color: #a5b4fc;
  }
  
  /* Animation */
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .animate-in { animation: fadeIn 0.3s ease forwards; }
  
  .wave-divider {
    display: flex; align-items: center; gap: 12px;
    margin: 20px 0 12px;
  }
  .wave-divider-line {
    flex: 1; height: 1px; background: var(--border);
  }
  .wave-divider-label {
    font-size: 11px; color: var(--text-muted); font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.08em;
    display: flex; align-items: center; gap: 6px;
  }
  
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 14px; border-radius: 8px; border: none;
    font-size: 12px; font-weight: 600; cursor: pointer;
    transition: all 0.2s;
  }
  .btn-ghost {
    background: rgba(255,255,255,0.06);
    color: var(--text-muted); border: 1px solid var(--border);
  }
  .btn-ghost:hover { background: rgba(255,255,255,0.1); color: var(--text); }
  .btn-primary {
    background: var(--accent); color: white;
    box-shadow: 0 2px 8px rgba(99,102,241,0.3);
  }
  .btn-primary:hover { background: #5254cc; }
  
  /* Collapsed wave */
  .wave-tasks-container {
    overflow: hidden;
    transition: max-height 0.3s ease;
  }
  
  .no-results { 
    text-align: center; color: var(--text-muted); 
    padding: 32px; font-size: 13px;
  }
</style>
</head>
<body>

<div class="header">
  <div style="font-size:24px">📋</div>
  <div>
    <div class="header-title">Delivery <span>Playbook</span> — 交互式流程图</div>
  </div>
  <div class="header-stats">
    <div class="stat-badge">📌 5 Phases</div>
    <div class="stat-badge">👥 29 Roles</div>
    <div class="stat-badge">✅ 724 Tasks</div>
  </div>
</div>

<div class="app-layout">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-label">视图模式</div>
      <div class="view-toggle">
        <button class="view-btn active" id="btn-phase-view" onclick="setView('phase')">🗺️ 阶段流程</button>
        <button class="view-btn" id="btn-role-view" onclick="setView('role')">👤 角色视图</button>
      </div>
    </div>
    
    <!-- Phase list (shown in phase view) -->
    <div class="sidebar-section" id="phase-selector-section">
      <div class="sidebar-label">选择阶段</div>
      <div class="phase-list" id="phase-list"></div>
    </div>
    
    <!-- Role list (shown in role view) -->
    <div class="sidebar-section" id="role-selector-section" style="display:none; flex:1; overflow:hidden; display:none; flex-direction:column;">
      <div class="sidebar-label">选择角色</div>
      <input class="role-search" type="text" placeholder="搜索角色..." oninput="filterRoles(this.value)" id="role-search">
      <div class="role-list" id="role-list"></div>
    </div>
  </div>
  
  <!-- Main content -->
  <div class="main" id="main-content">
    <div class="empty-state">
      <div class="empty-state-icon">👈</div>
      <div class="empty-state-title">选择左侧的阶段或角色</div>
      <div>开始浏览交付流程</div>
    </div>
  </div>
</div>

<!-- Task Detail Modal -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <div class="modal-header">
      <div style="flex:1">
        <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
          <span class="modal-phase-badge" id="modal-phase-badge"></span>
          <span class="tag" id="modal-wave-tag"></span>
        </div>
        <div class="modal-task-name" id="modal-task-name"></div>
        <div style="font-size:12px; color:var(--text-muted); margin-top:6px;" id="modal-role"></div>
      </div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-section">
        <div class="modal-section-label">📖 任务说明</div>
        <div class="modal-section-content" id="modal-desc"></div>
      </div>
      <div class="modal-section">
        <div class="modal-section-label">📊 元信息</div>
        <div class="meta-grid">
          <div class="meta-item"><div class="meta-key">Phase</div><div class="meta-val" id="modal-phase"></div></div>
          <div class="meta-item"><div class="meta-key">Wave</div><div class="meta-val" id="modal-wave"></div></div>
          <div class="meta-item"><div class="meta-key">Step</div><div class="meta-val" id="modal-step"></div></div>
          <div class="meta-item"><div class="meta-key">Task ID</div><div class="meta-val" style="font-family:monospace; font-size:11px;" id="modal-id"></div></div>
        </div>
      </div>
      <div class="modal-section" id="modal-next-section">
        <div class="modal-section-label">➡️ 触发下一批任务（Next）</div>
        <div id="modal-next-list" class="next-task-list"></div>
      </div>
    </div>
  </div>

// ---- View Switching ----
function setView(view) {
  currentView = view;
  document.getElementById('btn-phase-view').classList.toggle('active', view === 'phase');
  document.getElementById('btn-role-view').classList.toggle('active', view === 'role');
  document.getElementById('phase-selector-section').style.display = view === 'phase' ? '' : 'none';

  roleSec.style.display = view === 'role' ? 'flex' : 'none';
  roleSec.style.flexDirection = 'column';
  roleSec.style.flex = '1';
  roleSec.style.overflow = 'hidden';

    else renderEmptyState();
  } else {
    if (currentRole) selectRole(currentRole);
    else renderEmptyState();
  }

// ---- Phase List ----
function renderPhaseList() {
  const list = document.getElementById('phase-list');
  list.innerHTML = PHASE_ORDER.map(phase => {
    const count = TASKS.filter(t => t.phase === phase).length;
    const color = PHASE_COLORS[phase];
    return `<button class="phase-btn" id="phase-btn-${phase}" onclick="selectPhase('${phase}')">
      <div class="phase-dot" style="background:${color}"></div>
      <span>${PHASE_LABELS[phase]}</span>
      <span class="phase-count">${count}</span>
    </button>`;
  }).join('');
}

function selectPhase(phase) {
  currentPhase = phase;
  document.querySelectorAll('.phase-btn').forEach(btn => btn.classList.remove('active'));
  const btn = document.getElementById('phase-btn-' + phase);
  if (btn) {
    btn.classList.add('active');
    btn.style.background = PHASE_COLORS[phase] + '22';
    btn.style.borderColor = PHASE_COLORS[phase] + '55';
    btn.style.color = '#e2e8f0';
  }
  renderPhaseView(phase);
}

function renderPhaseView(phase) {
  const tasks = TASKS.filter(t => t.phase === phase);
  const wavesData = PHASE_WAVE_ROLES[phase];
  const color = PHASE_COLORS[phase];
  const label = PHASE_LABELS[phase];
  
  // Group tasks by wave
  const tasksByWave = {};
  tasks.forEach(t => {
    if (!tasksByWave[t.wave]) tasksByWave[t.wave] = [];
    tasksByWave[t.wave].push(t);
  });
  
  const main = document.getElementById('main-content');
  
  let html = `
    <div class="animate-in">
      <!-- Pipeline overview -->
      <div class="pipeline">
  `;
  
  PHASE_ORDER.forEach((p, i) => {
    const pColor = PHASE_COLORS[p];
    const isActive = p === phase;
    html += `
      <div class="pipeline-phase">
        <div class="pipeline-node" 
          style="background:${pColor}${isActive ? 'dd' : '33'}; color:${isActive ? 'white' : pColor}; border-color:${pColor}${isActive ? '' : '66'}"
          onclick="selectPhase('${p}')">
          ${PHASE_LABELS[p]}
        </div>
        ${i < PHASE_ORDER.length - 1 ? '<div class="pipeline-arrow">→</div>' : ''}
      </div>
    `;
  });
  
  html += `</div>
    
    <!-- Phase title -->
    <div class="phase-header">
      <div style="width:12px; height:12px; border-radius:50%; background:${color}; box-shadow: 0 0 12px ${color}"></div>
      <div>
        <div class="phase-title">${label}</div>
        <div class="phase-subtitle">${tasks.length} tasks · ${Object.keys(tasksByWave).length} waves · 按 Wave 串行执行，Wave 内并行</div>
      </div>
    </div>
    
    <!-- Search -->
    <div class="search-bar">
      <input class="search-input" type="text" placeholder="🔍 在此阶段内搜索任务..." 
        oninput="filterPhaseTasks(this.value, '${phase}')" id="phase-search">
    </div>
  `;
  
  // Waves
  const sortedWaves = Object.keys(tasksByWave).map(Number).sort((a,b) => a-b);
  
  sortedWaves.forEach((wave, wi) => {
    const waveTasks = tasksByWave[wave];
    const waveRoles = [...new Set(waveTasks.map(t => t.role))];
    const isCollapsed = collapsedWaves.has(`${phase}-${wave}`);
    
    html += `
      <div class="wave-section" id="wave-sec-${phase}-${wave}">
        <div class="wave-header" style="border-left-color:${color}" onclick="toggleWave('${phase}', ${wave})">
          <div class="wave-label">Wave ${wave}</div>
          <div class="wave-roles">
            ${waveRoles.map(r => `
              <span class="wave-role-chip" onclick="event.stopPropagation(); selectRole('${r}'); setView('role')">
                ${ROLE_ICONS[r] || '👤'} ${r}
              </span>
            `).join('')}
          </div>
          <div class="wave-parallel">⚡ ${waveTasks.length} tasks (parallel)</div>
          ${wi < sortedWaves.length - 1 ? '<div style="font-size:10px; color:var(--text-muted);">→ Wave ' + sortedWaves[wi+1] + '</div>' : '<div style="font-size:10px; color:#6b7280;">🔚 End</div>'}
          <div class="wave-expand-icon" id="expand-${phase}-${wave}" style="transform:${isCollapsed ? 'rotate(-90deg)' : 'rotate(0deg)'}">▾</div>
        </div>
        <div class="wave-tasks-container" id="wave-tasks-${phase}-${wave}" style="max-height:${isCollapsed ? '0' : '2000px'}">
          <div class="task-grid" id="task-grid-${phase}-${wave}">
            ${waveTasks.map(t => renderTaskCard(t, color)).join('')}
          </div>
        </div>
      </div>
      ${wi < sortedWaves.length - 1 ? `<div class="wave-divider"><div class="wave-divider-line"></div><div class="wave-divider-label">↓ 完成 Wave ${wave} 后进入 Wave ${wave+1}</div><div class="wave-divider-line"></div></div>` : ''}
    `;
  });
  
  html += '</div>';
  main.innerHTML = html;
}

function renderTaskCard(t, color) {
  const taskId = extractTaskId(t.task);
  return `
    <div class="task-card" onclick="showTaskDetail('${t.phase}_${t.num}')" style="border-left-color:${color}">
      <div class="task-role-badge">
        ${ROLE_ICONS[t.role] || '👤'} ${t.role}
      </div>
      <div class="task-name">${cleanTaskName(t.task)}</div>
      ${taskId ? `<div class="task-id">${taskId}</div>` : ''}
      ${t.description ? `<div class="task-desc-preview">${t.description}</div>` : ''}
      ${t.next && t.next !== '-' ? `<div class="task-next-count">➡️ ${countNextTasks(t.next)} next tasks</div>` : ''}
    </div>
  `;
}

function toggleWave(phase, wave) {
  const key = `${phase}-${wave}`;
  const container = document.getElementById(`wave-tasks-${phase}-${wave}`);
  const icon = document.getElementById(`expand-${phase}-${wave}`);
  if (collapsedWaves.has(key)) {
    collapsedWaves.delete(key);
    container.style.maxHeight = '2000px';
    icon.style.transform = 'rotate(0deg)';
  } else {
    collapsedWaves.add(key);
    container.style.maxHeight = '0';
    icon.style.transform = 'rotate(-90deg)';
  }
}

function filterPhaseTasks(query, phase) {
  const q = query.toLowerCase();
  const tasks = TASKS.filter(t => t.phase === phase);
  const wavesData = PHASE_WAVE_ROLES[phase];
  const tasksByWave = {};
  tasks.forEach(t => {
    if (!tasksByWave[t.wave]) tasksByWave[t.wave] = [];
    tasksByWave[t.wave].push(t);
  });
  
  Object.keys(tasksByWave).forEach(wave => {
    const grid = document.getElementById(`task-grid-${phase}-${wave}`);
    if (!grid) return;
    const filtered = tasksByWave[wave].filter(t =>
      t.task.toLowerCase().includes(q) ||
      t.role.toLowerCase().includes(q) ||
      t.description.toLowerCase().includes(q)
    );
    const color = PHASE_COLORS[phase];
    grid.innerHTML = filtered.map(t => renderTaskCard(t, color)).join('') || 
      (q ? '<div class="no-results">No matching tasks</div>' : '');
    
    // Auto-expand waves with results if searching
    if (q && filtered.length > 0) {
      const container = document.getElementById(`wave-tasks-${phase}-${wave}`);
      if (container) container.style.maxHeight = '2000px';
    }
  });
}

// ---- Role List ----
function renderRoleList(filter = '') {
  const list = document.getElementById('role-list');
  const filtered = ROLES.filter(r => r.toLowerCase().includes(filter.toLowerCase()));
  list.innerHTML = filtered.map(role => `
    <button class="role-item ${currentRole === role ? 'active' : ''}" onclick="selectRole('${role.replace(/'/g, "\'")}')" id="role-item-${safeId(role)}">
      <span class="role-icon">${ROLE_ICONS[role] || '👤'}</span>
      <span>${role}</span>
    </button>
  `).join('') || '<div style="text-align:center; color:var(--text-muted); padding:16px; font-size:12px;">No roles found</div>';
}

function filterRoles(val) {
  renderRoleList(val);
}

function selectRole(role) {
  currentRole = role;
  document.querySelectorAll('.role-item').forEach(el => el.classList.remove('active'));
  const el = document.getElementById('role-item-' + safeId(role));
  if (el) el.classList.add('active');
  
  if (currentView !== 'role') {
    setView('role');
    return;
  }
  renderRoleView(role);
}

// ---- Role View ----
function renderRoleView(role) {
  const roleTasks = TASKS.filter(t => t.role === role);
  const icon = ROLE_ICONS[role] || '👤';
  
  // Group by phase
  const tasksByPhase = {};
  roleTasks.forEach(t => {
    if (!tasksByPhase[t.phase]) tasksByPhase[t.phase] = [];
    tasksByPhase[t.phase].push(t);
  });
  
  const main = document.getElementById('main-content');
  
  let html = `
    <div class="animate-in">
      <div class="role-view-header">
        <div class="role-icon-large">${icon}</div>
        <div>
          <div class="role-name-large">${role}</div>
          <div class="role-task-count">${roleTasks.length} tasks across ${Object.keys(tasksByPhase).length} phases</div>
        </div>
        <div style="margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end;">
          ${PHASE_ORDER.filter(p => tasksByPhase[p]).map(p => `
            <div class="phase-dot" style="background:${PHASE_COLORS[p]}; width:10px; height:10px; border-radius:50%; display:inline-block;"></div>
          `).join('')}
        </div>
      </div>
      
      <!-- Phase pills summary -->
      <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:24px;">
        ${PHASE_ORDER.filter(p => tasksByPhase[p]).map(p => `
          <div style="
            background:${PHASE_COLORS[p]}22; 
            border:1px solid ${PHASE_COLORS[p]}44;
            border-radius:20px; padding:6px 14px;
            font-size:12px; color:${PHASE_COLORS[p]};
            font-weight:600; cursor:pointer;
          " onclick="document.getElementById('phase-block-${p}').scrollIntoView({behavior:'smooth', block:'start'})">
            ${PHASE_LABELS[p]} (${tasksByPhase[p].length})
          </div>
        `).join('')}
      </div>
      
      <div class="role-timeline">
  `;
  
  PHASE_ORDER.filter(p => tasksByPhase[p]).forEach(phase => {
    const phaseTasks = tasksByPhase[phase].sort((a,b) => a.wave - b.wave || a.step - b.step);
    const firstWave = phaseTasks[0]?.wave;
    const color = PHASE_COLORS[phase];
    
    html += `
      <div class="role-phase-block" id="phase-block-${phase}">
        <div class="role-phase-header" style="border-left:3px solid ${color}">
          <div class="phase-dot" style="background:${color}"></div>
          <div class="role-phase-label">${PHASE_LABELS[phase]}</div>
          ${firstWave !== undefined ? `<div class="role-phase-wave">Wave ${firstWave}</div>` : ''}
          <div style="margin-left:auto; display:flex; gap:8px;">
            <button class="btn btn-ghost" onclick="selectPhase('${phase}'); setView('phase');" style="font-size:11px;">
              → 查看完整阶段
            </button>
          </div>
        </div>
        <div class="role-tasks-list">
    `;
    
    phaseTasks.forEach(t => {
      const taskId = extractTaskId(t.task);
      const taskName = cleanTaskName(t.task);
      html += `
        <div class="role-task-item" onclick="showTaskDetail('${t.phase}_${t.num}')">
          <div class="role-task-step">${t.step}</div>
          <div class="role-task-info">
            <div class="role-task-name">${taskName}</div>
            ${t.description ? `<div class="role-task-desc">${t.description}</div>` : ''}
            ${taskId ? `<div class="role-task-id">${taskId}</div>` : ''}
          </div>
          <div style="color:var(--text-muted); font-size:18px; margin-left:8px;">›</div>
        </div>
      `;
    });
    
    html += '</div></div>';
  });
  
  if (Object.keys(tasksByPhase).length === 0) {
    html += `<div class="empty-state">
      <div class="empty-state-icon">🤷</div>
      <div class="empty-state-title">此角色暂无任务数据</div>
    </div>`;
  }
  
  html += '</div></div>';
  main.innerHTML = html;
}

// ---- Task Detail Modal ----
function showTaskDetail(taskId) {
  const t = TASKS.find(x => x.id === taskId);
  if (!t) return;
  
  const color = PHASE_COLORS[t.phase];
  const label = PHASE_LABELS[t.phase];
  const taskName = cleanTaskName(t.task);
  const tid = extractTaskId(t.task);
  
  document.getElementById('modal-phase-badge').textContent = label;
  document.getElementById('modal-phase-badge').style.background = color + '33';
  document.getElementById('modal-phase-badge').style.color = color;
  document.getElementById('modal-phase-badge').style.border = '1px solid ' + color + '55';
  document.getElementById('modal-wave-tag').textContent = 'Wave ' + t.wave;
  document.getElementById('modal-task-name').textContent = taskName;
  document.getElementById('modal-role').innerHTML = (ROLE_ICONS[t.role] || '👤') + ' ' + t.role;
  document.getElementById('modal-desc').textContent = t.description || 'No description available.';
  document.getElementById('modal-phase').textContent = label;
  document.getElementById('modal-wave').textContent = 'Wave ' + t.wave;
  document.getElementById('modal-step').textContent = 'Step ' + t.step;
  document.getElementById('modal-id').textContent = tid || t.id;
  
  // Next tasks
  const nextSection = document.getElementById('modal-next-section');
  const nextList = document.getElementById('modal-next-list');
  if (t.next && t.next !== '-') {
    const nextTasks = parseNextTasks(t.next);
    nextList.innerHTML = nextTasks.slice(0, 8).map((nt, i) => `
      <div class="next-task-chip">
        <div style="font-size:11px; color:var(--text-muted); margin-bottom:3px;">${nt.role}</div>
        <div style="font-size:12px;">${nt.task}</div>
        ${nt.id ? `<div style="font-size:10px; color:var(--text-muted); font-family:monospace; margin-top:2px;">${nt.id}</div>` : ''}
      </div>
    `).join('') + (nextTasks.length > 8 ? `<div style="font-size:11px; color:var(--text-muted); text-align:center; padding:8px;">+${nextTasks.length - 8} more...</div>` : '');
    nextSection.style.display = '';
  } else {
    nextSection.style.display = 'none';
  }
  
  document.getElementById('modal-overlay').classList.add('show');
}

function closeModal(event) {
  if (!event || event.target === document.getElementById('modal-overlay')) {
    document.getElementById('modal-overlay').classList.remove('show');
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

// ---- Helpers ----
function cleanTaskName(task) {
  return task.replace(/\[.*?\]/g, '').trim();
}

function extractTaskId(task) {
  const m = task.match(/\[([^\]]+)\]/);
  return m ? m[1] : null;
}

function parseNextTasks(nextStr) {
  if (!nextStr || nextStr === '-') return [];
  return nextStr.split(';').map(s => s.trim()).filter(Boolean).map(s => {
    const colonIdx = s.indexOf(':');
    if (colonIdx > -1) {
      const role = s.substring(0, colonIdx).trim();
      const taskPart = s.substring(colonIdx + 1).trim();
      const id = extractTaskId(taskPart);
      const name = cleanTaskName(taskPart);
      return { role, task: name, id };
    }
    return { role: '', task: s, id: null };
  });
}

function countNextTasks(nextStr) {
  return parseNextTasks(nextStr).length;
}

function safeId(str) {
  return str.replace(/[^a-zA-Z0-9]/g, '_');
}

function renderEmptyState() {
  document.getElementById('main-content').innerHTML = `
    <div class="empty-state">
      <div class="empty-state-icon">👈</div>
      <div class="empty-state-title">选择左侧的选项</div>
      <div>开始浏览交付流程</div>
    </div>
  `;
}

// Start
init();
</script>
</body>
</html>
