<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Delivery Playbook — 网络关系图</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
:root{--bg:#060612;--surface:#0f0f1f;--surface2:#161628;--border:rgba(255,255,255,0.07);--text:#e2e8f0;--muted:#64748b}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;height:100vh;overflow:hidden}
.hdr{height:56px;background:rgba(8,8,24,0.97);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 20px;position:fixed;top:0;left:0;right:0;z-index:100;backdrop-filter:blur(16px)}
.hdr h1{font-size:17px;font-weight:700;white-space:nowrap}.hdr h1 span{color:#818cf8}
.pills{display:flex;gap:5px;flex-wrap:wrap}
.pill{padding:4px 11px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid transparent;transition:all .2s;opacity:.45}
.pill.active{opacity:1}
.pill:hover{opacity:.8}
#canvas{position:fixed;top:56px;left:0;right:0;bottom:0}
.panel{position:fixed;top:56px;right:0;bottom:0;width:320px;background:rgba(8,8,24,0.98);border-left:1px solid var(--border);transform:translateX(100%);transition:transform .3s ease;overflow-y:auto;z-index:80}
.panel.open{transform:translateX(0)}
.panel::-webkit-scrollbar{width:3px}.panel::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px}
.ph{padding:16px;border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(8,8,24,.98)}
.ph-icon{font-size:30px;margin-bottom:6px}
.ph-name{font-size:15px;font-weight:700}
.ph-meta{font-size:11px;color:var(--muted);margin-top:3px}
.pc{position:absolute;top:14px;right:14px;background:none;border:none;color:var(--muted);cursor:pointer;font-size:17px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:5px}
.pc:hover{background:rgba(255,255,255,.1);color:var(--text)}
.ptabs{display:flex;gap:3px;padding:10px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.ptab{padding:3px 8px;border-radius:10px;font-size:10px;font-weight:600;cursor:pointer;border:1px solid transparent;color:var(--muted);background:rgba(255,255,255,.04);transition:all .15s}
.ptab.active{color:#fff}
.ptasks{padding:12px;display:flex;flex-direction:column;gap:7px}
.titem{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;cursor:pointer;transition:all .2s;border-left:3px solid}
.titem:hover{border-color:rgba(99,102,241,.4);background:rgba(99,102,241,.07)}
.titem.sel{background:rgba(99,102,241,.1)}
.tstep{font-size:10px;color:var(--muted);margin-bottom:3px}
.tname{font-size:12px;font-weight:600;line-height:1.4}
.tid{font-size:10px;color:var(--muted);font-family:monospace;margin-top:2px}
.tdesc{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.5}
.tnext{margin-top:6px;font-size:10px;color:#6366f1}
.back{position:fixed;top:66px;left:50%;transform:translateX(-50%);background:rgba(99,102,241,.15);border:1px solid rgba(99,102,241,.4);color:#a5b4fc;padding:6px 16px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;z-index:60;display:none;backdrop-filter:blur(10px)}
.back:hover{background:rgba(99,102,241,.25)}
.leg{position:fixed;top:68px;left:14px;z-index:50;background:rgba(8,8,24,.88);border:1px solid var(--border);border-radius:10px;padding:10px 12px;backdrop-filter:blur(10px)}
.ltitle{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:7px}
.li{display:flex;align-items:center;gap:6px;margin-bottom:4px;font-size:10px;color:var(--muted)}
.ld{width:8px;height:8px;border-radius:50%}
.tip{position:fixed;pointer-events:none;z-index:200;background:rgba(8,8,24,.95);border:1px solid rgba(255,255,255,.12);border-radius:7px;padding:7px 11px;font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.5);display:none}
.hint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:rgba(10,10,30,.9);border:1px solid var(--border);border-radius:20px;padding:7px 16px;font-size:11px;color:var(--muted);z-index:50;pointer-events:none;transition:opacity .3s}
</style>
</head>

const PO=['inception','requirements','development','qa_uat','release'];
const PL={inception:'Inception',requirements:'Requirements',development:'Sprint/Dev',qa_uat:'QA & UAT',release:'Release'};
const PC={inception:'#4f46e5',requirements:'#0891b2',development:'#059669',qa_uat:'#d97706',release:'#dc2626'};
const CC={management:'#8b5cf6',analysis:'#0ea5e9',design:'#ec4899',architecture:'#6366f1',security:'#f43f5e',quality:'#f59e0b',development:'#10b981',infrastructure:'#3b82f6',data:'#f97316',support:'#64748b'};
const CL={management:'管理层',analysis:'分析层',design:'设计层',architecture:'架构层',security:'安全层',quality:'质量层',development:'开发层',infrastructure:'基础设施',data:'数据层',support:'支持层'};

let curPhase='inception',panelOpen=false,panelPhase='inception',viewMode='role',sim,svg,g,zoom,allNodes,allLinks;
const W=()=>window.innerWidth, H=()=>window.innerHeight-56;

function init(){
  renderPills();renderLegend();setupSVG();renderRoleGraph();
}

function renderPills(){
  document.getElementById('pills').innerHTML=PO.map(p=>`
    <div class="pill ${p===curPhase?'active':''}" style="background:${PC[p]}22;color:${PC[p]};border-color:${PC[p]}55" onclick="setPhase('${p}')">P${PO.indexOf(p)+1}: ${PL[p]}</div>`).join('');
}

function renderLegend(){
  document.getElementById('litems').innerHTML=Object.entries(CL).map(([k,v])=>`
    <div class="li"><div class="ld" style="background:${CC[k]}"></div><span>${v}</span></div>`).join('');
}

function setupSVG(){
  svg=d3.select('#canvas').append('svg').attr('width',W()).attr('height',H()).style('cursor','grab');
  const defs=svg.append('defs');
  // Background gradient
  const rg=defs.append('radialGradient').attr('id','bg').attr('cx','50%').attr('cy','50%').attr('r','70%');
  rg.append('stop').attr('offset','0%').attr('stop-color','#0a0a22');
  rg.append('stop').attr('offset','100%').attr('stop-color','#060612');
  svg.append('rect').attr('width','100%').attr('height','100%').attr('fill','url(#bg)');
  // Glow filter
  const gf=defs.append('filter').attr('id','glow').attr('x','-60%').attr('y','-60%').attr('width','220%').attr('height','220%');
  const gb=gf.append('feGaussianBlur').attr('in','SourceGraphic').attr('stdDeviation','5').attr('result','blur');
  const gm=gf.append('feMerge');
  gm.append('feMergeNode').attr('in','blur');gm.append('feMergeNode').attr('in','SourceGraphic');
  // Edge glow
  const ef=defs.append('filter').attr('id','eglow');
  ef.append('feGaussianBlur').attr('in','SourceGraphic').attr('stdDeviation','2').attr('result','b');
  const em=ef.append('feMerge');em.append('feMergeNode').attr('in','b');em.append('feMergeNode').attr('in','SourceGraphic');
  // Arrow markers per category
  Object.entries(CC).forEach(([cat,col])=>{
    defs.append('marker').attr('id','arr-'+cat).attr('viewBox','0 -4 8 8')
      .attr('refX',30).attr('refY',0).attr('markerWidth',5).attr('markerHeight',5).attr('orient','auto')
      .append('path').attr('d','M0,-4L8,0L0,4').attr('fill',col+'88');
  });
  zoom=d3.zoom().scaleExtent([0.1,5]).on('zoom',e=>g.attr('transform',e.transform));
  svg.call(zoom);
  svg.on('click',()=>{if(panelOpen)closePanel();});
  g=svg.append('g');
}

function getCat(r){return CAT[r]||'support';}
function getCol(r){return CC[getCat(r)]||'#64748b';}

function renderRoleGraph(){
  viewMode='role';
  document.getElementById('back').style.display='none';
  document.getElementById('hint').style.opacity='1';
  if(sim)sim.stop();
  g.selectAll('*').remove();

  // Build nodes
  allNodes=ROLES.map(r=>{
    const tot=Object.values(RPT[r]||{}).flat().length;
    return{id:r,name:r.replace('# 📋 ',''),icon:ICONS[r]||'👤',cat:getCat(r),radius:26+Math.min(tot/6,8),x:W()/2+(Math.random()-.5)*400,y:H()/2+(Math.random()-.5)*300};
  });
  const nm=Object.fromEntries(allNodes.map(n=>[n.id,n]));

  // Build links
  allLinks=EDGES.map(e=>({source:nm[e.source],target:nm[e.target],weight:e.weight,phases:e.phases,cat:getCat(e.source)}))
    .filter(e=>e.source&&e.target);

  // Category cluster positions (circular arrangement)
  const cats=[...new Set(allNodes.map(n=>n.cat))];
  const catPos={};
  cats.forEach((c,i)=>{
    const a=(i/cats.length)*2*Math.PI;
    catPos[c]={x:W()/2+Math.cos(a)*200,y:H()/2+Math.sin(a)*200};
  });

  sim=d3.forceSimulation(allNodes)
    .force('link',d3.forceLink(allLinks).id(d=>d.id).distance(110).strength(0.5))
    .force('charge',d3.forceManyBody().strength(-420))
    .force('center',d3.forceCenter(W()/2,H()/2).strength(0.05))
    .force('collide',d3.forceCollide(d=>d.radius+20))
    .force('cluster',alpha=>{
      allNodes.forEach(n=>{const cp=catPos[n.cat];if(!cp)return;n.vx+=(cp.x-n.x)*alpha*.06;n.vy+=(cp.y-n.y)*alpha*.06;});
    });

  // Grid dots background
  for(let i=0;i<18;i++)for(let j=0;j<13;j++)
    g.append('circle').attr('cx',i*80).attr('cy',j*80).attr('r',.8).attr('fill','rgba(255,255,255,.025)');

  // Phase active check
  const isActive=e=>e.phases&&e.phases.includes(curPhase);

  // Links layer
  const lg=g.append('g');
  const lels=lg.selectAll('.lk').data(allLinks).join('line').attr('class','lk')
    .attr('stroke',d=>isActive(d)?CC[d.cat]:'rgba(80,80,120,.3)')
    .attr('stroke-width',d=>isActive(d)?1.8:.5)
    .attr('stroke-dasharray',d=>isActive(d)?null:'3,5')
    .attr('opacity',d=>isActive(d)?.55:.12)
    .attr('filter',d=>isActive(d)?'url(#eglow)':null)
    .attr('marker-end',d=>isActive(d)?`url(#arr-${d.cat})`:null);

  // Node groups
  const ng2=g.append('g');
  const nels=ng2.selectAll('.nd').data(allNodes).join('g').attr('class','nd').style('cursor','pointer')
    .call(d3.drag()
      .on('start',(e,d)=>{if(!e.active)sim.alphaTarget(.3).restart();d.fx=d.x;d.fy=d.y;})
      .on('drag',(e,d)=>{d.fx=e.x;d.fy=e.y;})
      .on('end',(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null;}))
    .on('click',(e,d)=>{e.stopPropagation();openRoleExpand(d.id,nm,allLinks,allNodes);});

  // Pulse ring
  nels.append('circle').attr('r',d=>d.radius+10).attr('fill','none')
    .attr('stroke',d=>getCol(d.id)).attr('stroke-width',1).attr('opacity',.18);
  // Main circle
  nels.append('circle').attr('r',d=>d.radius)
    .attr('fill',d=>getCol(d.id)+'1a').attr('stroke',d=>getCol(d.id)).attr('stroke-width',2)
    .attr('filter','url(#glow)');
  // Icon
  nels.append('text').attr('text-anchor','middle').attr('dy','-.1em')
    .attr('font-size',d=>Math.max(14,d.radius*.6)+'px').text(d=>d.icon);
  // Name label
  nels.append('text').attr('text-anchor','middle').attr('dy',d=>d.radius+15)
    .attr('font-size','9.5px').attr('fill','rgba(200,210,230,.75)').attr('font-weight','500')
    .text(d=>d.name.length>17?d.name.slice(0,16)+'…':d.name);
  // Category micro-label
  nels.append('text').attr('text-anchor','middle').attr('dy',d=>-d.radius-7)
    .attr('font-size','8px').attr('fill',d=>getCol(d.id)+'99')
    .text(d=>CL[d.cat]||'');
  // Wave badge
  nels.append('text').attr('text-anchor','middle').attr('dy','1em')
    .attr('font-size','8px').attr('fill',d=>getCol(d.id)+'99')
    .text(d=>{const w=(PRW[curPhase]||{})[d.id];return w?`W${w}`:''});

  // Tooltip
  nels.on('mouseenter',(e,d)=>{
    const tot=Object.values(RPT[d.id]||{}).flat().length;
    const w=(PRW[curPhase]||{})[d.id];
    const tip=document.getElementById('tip');
    tip.style.display='block';
    tip.innerHTML=`<b>${d.icon} ${d.name}</b><br><span style="color:#64748b">${CL[d.cat]} · ${tot} tasks · Wave ${w||'?'} in ${PL[curPhase]}</span>`;
    tip.style.left=(e.clientX+14)+'px';tip.style.top=(e.clientY-10)+'px';
  }).on('mouseleave',()=>document.getElementById('tip').style.display='none')
    .on('mousemove',e=>{const t=document.getElementById('tip');t.style.left=(e.clientX+14)+'px';t.style.top=(e.clientY-10)+'px';});

  sim.on('tick',()=>{
    lels.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
    nels.attr('transform',d=>`translate(${d.x},${d.y})`);
  });
}

function openRoleExpand(rid,nm,roleLinks,allRoleNodes){
  viewMode='task';
  document.getElementById('back').style.display='block';
  document.getElementById('hint').style.opacity='0';
  if(sim)sim.stop();
  g.selectAll('*').remove();

  const role=nm[rid];
  if(!role)return;
  const col=getCol(rid);
  const cx=W()/2, cy=H()/2;
  const tasks=(RPT[rid]||{})[curPhase]||[];

  // Find adjacent roles
  const nextRoles=new Set(), prevRoles=new Set();
  roleLinks.forEach(l=>{
    const si=typeof l.source==='object'?l.source.id:l.source;
    const ti=typeof l.target==='object'?l.target.id:l.target;
    if(si===rid)nextRoles.add(ti);
    if(ti===rid)prevRoles.add(si);
  });
  const adjAll=[...new Set([...nextRoles,...prevRoles])];

  // Background ambiance
  g.append('circle').attr('cx',cx).attr('cy',cy).attr('r',220).attr('fill',col+'06').attr('stroke',col+'12').attr('stroke-width',1);
  g.append('circle').attr('cx',cx).attr('cy',cy).attr('r',320).attr('fill','none').attr('stroke','rgba(255,255,255,.03)').attr('stroke-width',1).attr('stroke-dasharray','2,14');

  // Task nodes in inner ring
  const r1=tasks.length>1?Math.min(140,tasks.length*28):80;
  const taskData=tasks.map((t,i)=>{
    const a=(i/Math.max(tasks.length,1))*2*Math.PI-Math.PI/2;
    return{...t,x:cx+Math.cos(a)*r1,y:cy+Math.sin(a)*r1};
  });

  // Spokes from center to tasks
  taskData.forEach(t=>{
    g.append('line').attr('x1',cx).attr('y1',cy).attr('x2',t.x).attr('y2',t.y)
      .attr('stroke',col+'30').attr('stroke-width',1).attr('stroke-dasharray','3,6');
  });

  // Adjacent role nodes in outer ring
  const adjData=adjAll.map((ar,i)=>{
    const a=(i/Math.max(adjAll.length,1))*2*Math.PI-Math.PI/2;
    return{id:ar,name:ar.replace('# 📋 ',''),icon:ICONS[ar]||'👤',cat:getCat(ar),
      x:cx+Math.cos(a)*340,y:cy+Math.sin(a)*340,
      isNext:nextRoles.has(ar),isPrev:prevRoles.has(ar)};
  });

  // Task→adj-role links
  const linkLayer=g.append('g');
  taskData.forEach(t=>{
    (t.next_roles||[]).slice(0,3).forEach(nr=>{
      const adj=adjData.find(a=>a.id===nr);
      if(!adj)return;
      const ac=getCol(nr),mx=(t.x+adj.x)/2+(adj.y-t.y)*.18,my=(t.y+adj.y)/2-(adj.x-t.x)*.18;
      linkLayer.append('path')
        .attr('d',`M${t.x},${t.y} Q${mx},${my} ${adj.x},${adj.y}`)
        .attr('stroke',ac+'55').attr('stroke-width',1.5).attr('fill','none')
        .attr('filter','url(#eglow)').attr('marker-end',`url(#arr-${getCat(nr)})`);
    });
  });

  // Adjacent role nodes
  adjData.forEach(n=>{
    const nc=getCol(n.id);
    const ng3=g.append('g').style('cursor','pointer')
      .on('click',e=>{e.stopPropagation();openRoleExpand(n.id,nm,roleLinks,allRoleNodes);});
    const lbl=n.isNext&&n.isPrev?'⇄':n.isNext?'↓ 下游':'↑ 上游';
    g.append('text').attr('x',n.x).attr('y',n.y-35).attr('text-anchor','middle')
      .attr('font-size','8px').attr('fill',nc+'88').text(lbl);
    ng3.append('circle').attr('cx',n.x).attr('cy',n.y).attr('r',22)
      .attr('fill',nc+'15').attr('stroke',nc+'55').attr('stroke-width',1.5).attr('filter','url(#glow)');
    ng3.append('text').attr('x',n.x).attr('y',n.y).attr('text-anchor','middle')
      .attr('dy','.35em').attr('font-size','15px').text(n.icon);
    ng3.append('text').attr('x',n.x).attr('y',n.y+32).attr('text-anchor','middle')
      .attr('font-size','8.5px').attr('fill','rgba(180,190,210,.78)')
      .text(n.name.length>14?n.name.slice(0,13)+'…':n.name);
  });

  // Task nodes
  const tg=g.append('g');
  taskData.forEach((t,i)=>{
    const el=tg.append('g').style('cursor','pointer').on('click',e=>{e.stopPropagation();selectTask(rid,i,t.uid);});
    el.append('circle').attr('cx',t.x).attr('cy',t.y).attr('r',21)
      .attr('fill',col+'22').attr('stroke',col).attr('stroke-width',1.8).attr('filter','url(#glow)');
    el.append('text').attr('x',t.x).attr('y',t.y).attr('text-anchor','middle')
      .attr('dy','.35em').attr('font-size','11px').attr('font-weight','700').attr('fill',col).text(t.step);
    const words=t.name.split(' '),line1=words.slice(0,2).join(' '),line2=words.slice(2,4).join(' ');
    el.append('text').attr('x',t.x).attr('y',t.y+29).attr('text-anchor','middle')
      .attr('font-size','8px').attr('fill','rgba(210,220,235,.85)').text(line1.slice(0,13));
    if(line2)el.append('text').attr('x',t.x).attr('y',t.y+39).attr('text-anchor','middle')
      .attr('font-size','8px').attr('fill','rgba(210,220,235,.65)').text(line2.slice(0,13));
    if(t.task_id)el.append('text').attr('x',t.x).attr('y',t.y-28).attr('text-anchor','middle')
      .attr('font-size','7.5px').attr('fill',col+'77').attr('font-family','monospace').text(t.task_id);
  });

  // Center node
  const cg2=g.append('g');
  cg2.append('circle').attr('cx',cx).attr('cy',cy).attr('r',48)
    .attr('fill',col+'2a').attr('stroke',col).attr('stroke-width',3).attr('filter','url(#glow)');
  cg2.append('circle').attr('cx',cx).attr('cy',cy).attr('r',58)
    .attr('fill','none').attr('stroke',col+'35').attr('stroke-width',1.5).attr('stroke-dasharray','4,5');
  cg2.append('text').attr('x',cx).attr('y',cy).attr('text-anchor','middle')
    .attr('dy','-.15em').attr('font-size','28px').text(role.icon);
  cg2.append('text').attr('x',cx).attr('y',cy+22).attr('text-anchor','middle')
    .attr('font-size','9.5px').attr('fill',col).attr('font-weight','700')
    .text(role.name.slice(0,20));
  cg2.append('text').attr('x',cx).attr('y',cy+35).attr('text-anchor','middle')
    .attr('font-size','8px').attr('fill',col+'88').text(`${tasks.length} tasks in ${PL[curPhase]}`);

  openPanel(rid);
}

function openPanel(rid){
  panelOpen=true;panelPhase=curPhase;
  document.getElementById('panel').classList.add('open');
  document.getElementById('picon').textContent=ICONS[rid]||'👤';
  document.getElementById('pname').textContent=(rid||'').replace('# 📋 ','');
  const tot=Object.values(RPT[rid]||{}).flat().length;
  document.getElementById('pmeta').textContent=`${CL[getCat(rid)]} · ${tot} tasks total`;
  document.getElementById('ptabs').innerHTML=PO.map(p=>`
    <div class="ptab ${p===panelPhase?'active':''}" id="ptab-${p}"
      style="${p===panelPhase?`background:${PC[p]}22;color:${PC[p]};border-color:${PC[p]}55`:''}"
      onclick="switchPanelPhase('${rid}','${p}')">${PL[p].replace('Sprint/Dev','Dev')}</div>`).join('');
  renderPanelTasks(rid,panelPhase,null);
}

function switchPanelPhase(rid,p){
  panelPhase=p;
  document.querySelectorAll('.ptab').forEach(el=>{el.classList.remove('active');el.style.cssText='';});
  const t=document.getElementById('ptab-'+p);
  if(t){t.classList.add('active');t.style.background=PC[p]+'22';t.style.color=PC[p];t.style.borderColor=PC[p]+'55';}
  renderPanelTasks(rid,p,null);
}

function renderPanelTasks(rid,p,selUid){
  const tasks=(RPT[rid]||{})[p]||[];
  const col=getCol(rid);
  const el=document.getElementById('ptasks');
  if(!tasks.length){el.innerHTML='<div style="text-align:center;color:var(--muted);padding:20px;font-size:11px">该阶段无任务</div>';return;}
  el.innerHTML=tasks.map(t=>`
    <div class="titem ${t.uid===selUid?'sel':''}" style="border-left-color:${col}" onclick="highlightTask('${rid}','${p}','${t.uid}')">
      <div class="tstep">Step ${t.step}</div>
      <div class="tname">${t.name}</div>
      <div class="tid">${t.task_id||''}</div>
      <div class="tdesc">${(t.description||'').slice(0,100)}${(t.description||'').length>100?'…':''}</div>
      ${(t.next_roles||[]).length?`<div class="tnext">→ ${t.next_roles.slice(0,2).map(r=>r.replace('# 📋 ','')).join(', ')}</div>`:''}
    </div>`).join('');
}

function highlightTask(rid,p,uid){renderPanelTasks(rid,p,uid);}
function selectTask(rid,idx,uid){renderPanelTasks(rid,panelPhase,uid);}
function closePanel(){panelOpen=false;document.getElementById('panel').classList.remove('open');}
function backToRoles(){closePanel();renderRoleGraph();}
function setPhase(p){
  curPhase=p;renderPills();
  if(viewMode==='role')renderRoleGraph();
}
window.addEventListener('resize',()=>svg.attr('width',W()).attr('height',H()));
init();
</script>
